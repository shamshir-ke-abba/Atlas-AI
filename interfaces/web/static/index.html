<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Atlas AI</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >
</head>

<body>

    <main class="container">

        <h1>Atlas AI</h1>

        <section id="chat"></section>

        <div class="input-area">

            <input
                id="message"
                type="text"
                placeholder="Ask Atlas something..."
                autocomplete="off"
            >

            <button
                id="send"
                type="button"
            >
                Send
            </button>

        </div>

    </main>

    <script src="/static/app.js"></script>

</body>

</html>
